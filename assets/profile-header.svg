    <path d="m1082 106-5 23-8 62M1051 133l26-4 27 8M1051 133l-16 24-24 5M1104 137l18 23 8 28M1054 187l15 4 16 3M1058 190l-10 48 8 49M1081 193l23 42 24 45"/>
