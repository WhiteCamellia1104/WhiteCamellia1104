  <g fill="none" stroke="#A2B496" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".28">
    <circle cx="806" cy="112" r="13"/>
    <path d="m808 126 7 23 11 53M788 148l27 1 27-4M788 148l-14 27-14 17M842 145l19 18 17-13M812 201l14 1 15-6M817 202l-24 42-22 46M837 198l29 40 20 46"/>
