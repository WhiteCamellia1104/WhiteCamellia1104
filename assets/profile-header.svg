  <g fill="none" stroke="#6D8C75" stroke-width="1" opacity=".27">
    <path d="M734 302h400M770 319l47-34M890 319l15-34M1010 319l-17-34M1130 319l-49-34"/>
    <path d="M766 302c78-5 112-70 170-98s132 2 197-48" stroke-dasharray="3 7"/>
  </g>

