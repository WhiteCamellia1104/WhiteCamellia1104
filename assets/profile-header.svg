<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Zhang Yuxuan — Motion. Models. Meaningful code.</title>
  <desc id="description">A forest-green profile header with ivory typography and three geometric humanoid poses connected by a motion trajectory. Research interests: humanoid robotics and motion generation.</desc>

  <rect width="1200" height="360" rx="18" fill="#193B32"/>

  <!-- A quiet editorial rhythm, with a small signature marker. -->
  <path d="M64 48h20" stroke="#B7C8A5" stroke-width="3"/>
  <text x="98" y="53" fill="#BAC8B5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="3">WHITECAMELLIA1104</text>

  <text x="64" y="156" fill="#F4F0E5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="70" font-weight="600" letter-spacing="-3.5">Zhang Yuxuan<tspan fill="#B7C8A5">.</tspan></text>
  <text x="67" y="205" fill="#D2D9C9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25" font-weight="400" letter-spacing="-.4">Motion. Models. Meaningful code.</text>

